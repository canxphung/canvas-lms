# RCE shares the Canvas HTTPS origin; the tunnel/DNS stays unchanged.
location ^~ /rce-api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $rce_upstream canvasrceapi;
    rewrite ^/rce-api/(.*)$ /$1 break;
    proxy_pass http://$rce_upstream:80;
    proxy_http_version 1.1;
    proxy_set_header Host canvas.canxphung.dev;
    proxy_set_header X-Forwarded-Host canvas.canxphung.dev;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 90s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;

    # Upstream creates these three navigation fields without a path prefix.
    # Restrict replacement to these fields: Canvas upload/download URLs must
    # retain their original /api/v1 paths.
    sub_filter_types application/json;
    sub_filter_once off;
    sub_filter '"bookmark":"http://canvas.canxphung.dev/api/' '"bookmark":"https://canvas.canxphung.dev/rce-api/api/';
    sub_filter '"bookmark":"https://canvas.canxphung.dev/api/' '"bookmark":"https://canvas.canxphung.dev/rce-api/api/';
    sub_filter '"filesUrl":"http://canvas.canxphung.dev/api/' '"filesUrl":"https://canvas.canxphung.dev/rce-api/api/';
    sub_filter '"filesUrl":"https://canvas.canxphung.dev/api/' '"filesUrl":"https://canvas.canxphung.dev/rce-api/api/';
    sub_filter '"foldersUrl":"http://canvas.canxphung.dev/api/' '"foldersUrl":"https://canvas.canxphung.dev/rce-api/api/';
    sub_filter '"foldersUrl":"https://canvas.canxphung.dev/api/' '"foldersUrl":"https://canvas.canxphung.dev/rce-api/api/';
}
